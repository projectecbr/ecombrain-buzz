# EcomBrain spike: mirror the UNPATCHED upstream relay image into our registry.
# Upstream publishes ghcr.io/block/buzz:<semver> for relay-v* tags (multi-arch).
# We deploy the relay unpatched, so the mirror is a pull/re-tag/push — no build.
name: Mirror relay image

on:
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: "Upstream image tag (semver, e.g. 0.2.0 for relay-v0.2.0)"
        required: true
        default: "0.2.0"

permissions:
  contents: read
  packages: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Login to ghcr (org namespace)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Mirror image
        env:
          TAG: ${{ inputs.upstream_tag }}
        run: |
          set -euo pipefail
          SRC="ghcr.io/block/buzz:${TAG}"
          DST="ghcr.io/projectecbr/ecombrain-buzz-relay:${TAG}"
          docker buildx imagetools create -t "$DST" "$SRC"
          docker buildx imagetools create -t "ghcr.io/projectecbr/ecombrain-buzz-relay:relay-v${TAG}" "$SRC"
          echo "mirrored $SRC -> $DST"
